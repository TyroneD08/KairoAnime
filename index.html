<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairo</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" type="module" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="site-header__inner">
            <a class="site-header__brand" href="#" aria-label="Weebsite home">
                <span class="site-header__mark" aria-hidden="true"></span>
                KairoAnime
            </a>
            <span class="site-header__tagline">Your anime collection</span>
        </div>
    </header>
    <main class="catalog">
        <aside class="search-panel" aria-labelledby="search-title">
            <p class="search-panel__eyebrow">FIND YOUR NEXT FAVORITE</p>
            <h1 id="search-title">Explore anime</h1>
            <p class="search-panel__intro">Search loaded titles. Load more to add pages from the top anime list.</p>
            <form class="search-form" id="search-form">
                <label class="search-form__label" for="anime-search">Anime title</label>
                <input
                    class="search-form__input"
                    id="anime-search"
                    name="q"
                    type="search"
                    placeholder="Search anime"
                    autocomplete="off"
                >

                <label class="search-form__label" for="genre-filter">Genre</label>
                <select class="search-form__select" id="genre-filter" name="genres">
                    <option value="">All genres</option>
                    <option value="1">Action</option>
                    <option value="2">Adventure</option>
                    <option value="4">Comedy</option>
                    <option value="8">Drama</option>
                    <option value="10">Fantasy</option>
                    <option value="22">Romance</option>
                    <option value="24">Sci-Fi</option>
                    <option value="36">Slice of Life</option>
                    <option value="14">Horror</option>
                </select>

                <button class="search-form__reset" id="reset-search" type="reset">Clear</button>
            </form>
        </aside>

        <section class="catalog-results" aria-labelledby="results-title">
            <div class="catalog-results__heading">
                <div>
                    <p class="catalog-results__eyebrow">TOP ANIME</p>
                    <h2 id="results-title">Popular anime</h2>
                </div>
                <p class="catalog-results__count" id="result-count"></p>
            </div>
            <p class="catalog-results__status" id="search-status" role="status" aria-live="polite"></p>
            <div class="anime-grid" id="anime-grid"></div>
            <button class="load-more" id="load-more" type="button">Load more anime</button>
        </section>
    </main>
    <footer class="site-footer">
        <div class="site-footer__inner">
            <span class="site-footer__brand">Weebsite</span>
            <p>Made for anime fans <span aria-hidden="true">✦</span></p>
        </div>
    </footer>
</body>
</html>
